  <header><h1>v0.56.58 更新說明</h1><p class="meta">Infinite Studio · 發布日期：2026-11-08</p></header>
  <section><h2>更新內容</h2><p>改善開啟 Google Drive 共享檔案時的授權失敗提示。</p></section>
  <section><h2>修正：授權失敗</h2><p>選檔器逾時、無法載入或選錯檔案時，分享視窗會顯示錯誤及重新授權按鈕，避免把失敗誤認為尚未開始的授權步驟。</p></section>
  <section><h2>注意事項</h2><p>首次開啟某些共享檔案可能仍需要在 Google 選擇指定檔案；權限由 Google Drive 管理。</p></section>
  <section><h2>回復與備份</h2><p>授權失敗不會以空白畫布取代目前內容。更新前請確認工作內容已儲存，必要時下載 .studio 備份。</p></section>
