<!doctype html>
<html lang="zh-Hant">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Infinite Studio v0.56.11 更新說明</title>
<style>
  :root { color-scheme:light dark; font-family:system-ui,-apple-system,sans-serif }
  * { box-sizing:border-box } body { margin:0; background:#f4f4f2; color:#171717 }
  main { max-width:760px; margin:auto; padding:64px 24px 96px }
  header,section { border-bottom:1px solid #cfcfca; padding-bottom:28px } section { padding-top:28px }
  h1 { font-size:clamp(32px,7vw,56px); line-height:1.1; letter-spacing:-.04em; margin:0 }
  h2 { font-size:18px } p,li { font-size:16px; line-height:1.7 } li+li { margin-top:8px }
  .meta { font-size:14px; color:#666 } footer { padding-top:28px } a { color:inherit }
  @media(prefers-color-scheme:dark) { body { background:#0d0d0d; color:#f2f2ef } header,section { border-color:#363636 } .meta { color:#aaa } }
</style>
<main>
  <header><h1>v0.56.11 更新說明</h1><p class="meta">Infinite Studio · 發布日期：2026-11-03</p></header>
  <section><h2>更新內容</h2><p>方向鍵可同時移動選取的物件；px、mm 每次移動 1 單位；cm、inch 每次移動 0.1 單位。</p></section>
  <section><h2>修正</h2><p>按住 Shift 時，px、mm 每次移動 10 單位；cm、inch 每次移動 1 個單位。</p></section>
  <section><h2>注意事項</h2><p>拖曳時吸附視窗內物件和可見導引線；Command／Ctrl 暫停吸附，Option／Alt 切換為另一個軸向吸附。</p></section>
  <section><h2>回復與備份</h2><p>文字物件可調整行高，新文字預設 1.3；既有文字保留原有行距。放大品牌名稱並更新側欄控制器。</p></section>
  <footer><a href="../">回到 Infinite Studio</a></footer>
</main>
</html>
